name: Generate reproducible npm lockfile

on:
  push:
    branches:
      - fix/repair-studio-build

permissions:
  contents: write

jobs:
  lockfile:
    if: github.ref == 'refs/heads/fix/repair-studio-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repair-studio-build
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate npm lockfile from pinned package.json
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Verify clean install and production build
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
          else
            git commit -m "build: add generated npm lockfile [skip ci]"
            git push origin HEAD:fix/repair-studio-build
          fi
