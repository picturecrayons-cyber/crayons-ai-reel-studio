name: Build and API tests

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feat/option-a-free-first-mp4-export']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
